name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Install Android SDK platform 36
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Build debug APK (signed, installable)
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: superisland-guard-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Push APK to dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/dist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/dist/app-debug.apk
          cd /tmp/dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git commit -q -m "app-debug.apk $(date -u +%Y%m%dT%H%M%SZ)" || echo "无变更"
          git branch -M dist
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/ynwx11280092-byte/superisland-guard.git"
          git push -f origin dist
